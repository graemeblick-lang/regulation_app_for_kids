name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalmCorner.apk
      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: calm-corner-debug-apk
          path: CalmCorner.apk

      # Branch pushes: refresh the rolling "latest test build" (the usual download link):
      # https://github.com/<owner>/<repo>/releases/latest/download/CalmCorner.apk
      - name: Publish to "latest test build"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Calm Corner (latest test build)
          body: |
            Latest test build from commit ${{ github.sha }}.
            On your Android phone, tap **CalmCorner.apk** below to download and install it.
            Looking for a specific version? See the numbered releases (e.g. v0.3.0).
          prerelease: false
          make_latest: true
          files: CalmCorner.apk

      # Version tags (v0.3.0 etc.): a permanent numbered release that never changes,
      # so a known-good version can always be reinstalled.
      - name: Name versioned APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp CalmCorner.apk "CalmCorner-${GITHUB_REF_NAME}.apk"
      - name: Publish numbered release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Calm Corner ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          make_latest: false
          # Also include CalmCorner.apk so the usual "latest" download link works
          # even if this release gets marked as Latest on GitHub.
          files: |
            CalmCorner-${{ github.ref_name }}.apk
            CalmCorner.apk
